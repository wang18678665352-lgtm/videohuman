[project]
name = "videohuman"
version = "0.1.0"
description = "videohuman — CLI 优先的本地数字人口播视频流水线"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# torch 系从 PyTorch 官方 cu128 索引安装(Blackwell/50 系显卡必须 cu128+;
# 其他显卡可改 tool.uv.index 的 cu 版本或删掉索引配置走 PyPI 默认)。
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "fonttools>=4.50",
    "imageio-ffmpeg>=0.5",
    "openai>=1.0",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers==4.51.3",
    "diffusers>=0.30.2,<1",
    "numpy>=1.26,<2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-contrib-python>=4.9",
    "einops>=0.8",
    "omegaconf>=2.3",
    "tqdm>=4.66",
    "pillow>=10",
    "HyperPyYAML>=1.2",
    "modelscope>=1.20",
    "onnxruntime-gpu==1.22.*",
    "openai-whisper==20231117",
    "inflect>=7",
    "conformer==0.3.2",
    "x-transformers>=2",
    "scipy>=1.12",
    "regex>=2024.4",
    "mediapipe==0.10.21",
    "hydra-core>=1.3",
    "pyarrow>=18",
    "pyworld>=0.3.4",
    "funasr>=1.2",
    "biliup>=0.4",
    "playwright>=1.40",
    "insightface==0.7.3",
    "kornia>=0.8.3",
    "accelerate>=1.14.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
]

# cu128 索引里混着一个 torch==2.0.1,只有 aarch64 轮子。
# 通用求解会把「Linux x86_64 或 Windows」并成同一个分支;一旦回溯到 2.0.1,
# 锁文件会写成已解决,uv sync 却在这两块平台上下不了轮子。
# required-environments 要求这种没有源码包的依赖必须带上目标平台的轮子。
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# openai-whisper==20231117 的 setup.py 会在「正在跑 uv lock 的机器是 Linux x86_64」时,
# 把 triton>=2,<3 写进依赖,而且不带环境标记。cu128 的 torch 2.7+ 在 Linux 上要 triton 3.x,
# 两边合在一起就无解,求解器只好退回那个 2.0.1。
# whisper 只用 triton 做可选的 CUDA 时间戳加速,失败会退回普通 PyTorch。
# 这里只从 whisper 身上去掉 triton;torch 自己的 triton==3.6.0(仅 Linux)仍然保留。
exclude-dependencies = [
    { package = { name = "openai-whisper", version = "20231117" }, dependencies = ["triton"] },
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# openai-whisper 20231117 的 sdist 构建期 import pkg_resources 但未声明;
# setuptools>=81 已移除 pkg_resources,需钉旧版
[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81"]

[project.scripts]
vh = "vh_cli.main:app"

# 测试怎么跑见 TESTING.md。这里只告诉 pytest 去哪找测试。
[tool.pytest.ini_options]
testpaths = ["tests"]
# 未 pip install -e 时也能 import vh_core
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vh_core", "vh_cli", "vh_server"]

# ---------------------------------------------------------------- ruff
# 本仓库自有代码只包含 vh_core / vh_cli / vh_server / download_weights.py;
# third_party/ 与 web/ 是 vendor 与前端产物,不参与检查。
[tool.ruff]
line-length = 120          # 代码里存在较多中文注释与 ffmpeg 参数行
target-version = "py311"   # 与 requires-python 对齐(ruff 默认按 py39 判断)
extend-exclude = [
    "third_party",
    "web",
    "models",
    "workspace",
    "assets",
    "configs",
    "examples",
    "docker",
]

[tool.ruff.lint]
select = [
    "E", "W",        # pycodestyle
    "F",             # pyflakes(未定义名/未使用 import —— 真 bug)
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "PIE",           # flake8-pie
    "RUF",           # ruff 自有规则(含 RUF100 noqa 卫生)
]
ignore = [
    "E501",          # 行长由 formatter 兜底;中文注释不计入
    "B008",          # typer 的参数默认值必须是 typer.Option(...) 调用
    "B905",          # zip(strict=) 对"词/时间戳"这类必须容忍长度不一致的配对不适用
    "UP042",         # StageStatus(str, Enum) 是与 pydantic/JSON 兼容的既有约定
    "RUF001", "RUF002", "RUF003",  # 中文全角标点是刻意的排版风格
]

[tool.ruff.lint.per-file-ignores]
# typer 用 OptionInfo 作为默认值生成 CLI 帮助,docstring 动态拼接同理
"vh_cli/main.py" = ["B008", "B021"]

[tool.ruff.lint.isort]
known-first-party = ["vh_core", "vh_cli", "vh_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
