# videohuman 默认配置
# 优先级：环境变量(VH_ 前缀) > 本文件 > 代码默认值

# ffmpeg 可执行文件(PATH 中的命令名或绝对路径)
ffmpeg_bin = "ffmpeg"

# 目录(相对项目根)
workspace_dir = "workspace"
assets_dir = "assets"
models_dir = "models"

# 抖音下载 cookie:敏感数据,建议用环境变量 VH_DOUYIN_COOKIE 注入,勿写进本文件
# douyin_cookie = ""

# 发布登录态存放目录(storage_state / biliup cookie JSON,敏感,勿外发)
publish_cookies_dir = "configs/cookies"

# 数字人引擎:musetalk(默认,MIT 开源)| lstmsync(可选,引擎与权重需用户自备,见 README)
# avatar_engine = "musetalk"
# lstmsync 引擎目录(仅 avatar_engine = "lstmsync" 时使用;仓库不附带,需自行获取)
lstmsync_dir = "third_party/lstmsync"

# AI 生成内容标识(合规):成片画面角标文字;隐式元数据(AIGC 字段)里的内容制作者名称
# aigc_label_text = "本视频由AI生成"
# aigc_producer = "videohuman"
# false 仅用于内部实验,成片仍会写入隐式 AIGC 元数据
commercial_mode = true

# LLM 润色提示词文件(UTF-8 纯文本);留空用内置合规版(润色纠错、忠于原意)
# llm_prompt_file = "configs/prompts/rewrite.txt"
