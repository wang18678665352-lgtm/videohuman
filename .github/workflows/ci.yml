name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      # 只装轻量依赖:测试全部使用假 runner,不需要 torch/GPU/模型权重
      - name: Install dependencies
        run: |
          uv venv .venv-dev
          uv pip install -p .venv-dev -r requirements-dev.txt
      - name: Ruff lint
        run: .venv-dev/bin/ruff check .
      - name: Ruff format
        run: .venv-dev/bin/ruff format --check vh_core vh_cli vh_server tests download_weights.py
      - name: Lockfile up to date
        run: uv lock --check
      - name: Pytest
        run: .venv-dev/bin/python -m pytest

  web:
    name: Build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
